<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="390" viewBox="0 0 1060 390" role="img" aria-label="ConfusionGuard pipeline: manifests are parsed, checked statically and against registries, scored, then reported">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a" />
    </marker>
    <style>
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .box-blue { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .box-green { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
      .box-amber { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
      .box-red { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; }
      .t { fill: #1f2328; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .s { fill: #57606a; font: 11px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .edge { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .legend { fill: #57606a; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="390" fill="#ffffff" />

  <!-- A: manifests -->
  <rect class="box" x="20" y="150" width="200" height="95" rx="9" />
  <text class="t" x="120" y="178" text-anchor="middle">Manifests</text>
  <text class="s" x="120" y="198" text-anchor="middle">package.json</text>
  <text class="s" x="120" y="214" text-anchor="middle">requirements*.txt</text>
  <text class="s" x="120" y="230" text-anchor="middle">pyproject.toml</text>

  <!-- B: parser -->
  <rect class="box-blue" x="270" y="155" width="150" height="85" rx="9" />
  <text class="t" x="345" y="186" text-anchor="middle">Parser</text>
  <text class="s" x="345" y="206" text-anchor="middle">name · spec</text>
  <text class="s" x="345" y="222" text-anchor="middle">dedupe</text>

  <path class="edge" d="M220,197 L268,197" />

  <!-- split -->
  <path class="edge" d="M420,197 L452,197 L452,80 L488,80" />
  <path class="edge" d="M420,197 L452,197 L452,302 L488,302" />

  <!-- C: static -->
  <rect class="box-amber" x="490" y="40" width="230" height="80" rx="9" />
  <text class="t" x="605" y="70" text-anchor="middle">Static analysis</text>
  <text class="s" x="605" y="90" text-anchor="middle">edit distance · separator tricks</text>
  <text class="s" x="605" y="106" text-anchor="middle">popular-package baseline</text>

  <!-- D: registry -->
  <rect class="box" x="490" y="255" width="230" height="95" rx="9" />
  <text class="t" x="605" y="285" text-anchor="middle">Registry lookup</text>
  <text class="s" x="605" y="305" text-anchor="middle">npm · PyPI (read-only)</text>
  <text class="s" x="605" y="321" text-anchor="middle">age · downloads</text>
  <text class="s" x="605" y="337" text-anchor="middle">maintainers · repo</text>

  <!-- converge -->
  <path class="edge" d="M720,80 L742,80 L742,175 L758,175" />
  <path class="edge" d="M720,302 L742,302 L742,205 L758,205" />

  <!-- E: scoring -->
  <rect class="box-red" x="760" y="145" width="170" height="90" rx="9" />
  <text class="t" x="845" y="177" text-anchor="middle">Risk score</text>
  <text class="s" x="845" y="197" text-anchor="middle">0–100 + reasons</text>
  <text class="s" x="845" y="213" text-anchor="middle">info → critical</text>

  <!-- F: report -->
  <path class="edge" d="M930,190 L963,190" />
  <rect class="box-green" x="975" y="150" width="70" height="80" rx="9" />
  <text class="t" x="1010" y="182" text-anchor="middle">Report</text>
  <text class="s" x="1010" y="202" text-anchor="middle">table</text>
  <text class="s" x="1010" y="218" text-anchor="middle">JSON</text>

  <text class="legend" x="20" y="374">No dependency is installed, imported, or executed. Network access is read-only against registry.npmjs.org and pypi.org.</text>
</svg>
