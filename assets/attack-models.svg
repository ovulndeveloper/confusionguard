<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Two attack models: typosquatting and dependency confusion">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a" />
    </marker>
    <style>
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .real { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
      .fake { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; }
      .priv { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .h { fill: #1f2328; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .t { fill: #1f2328; font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .s { fill: #57606a; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .edge { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="330" fill="#ffffff" />

  <!-- Typosquatting -->
  <rect class="panel" x="20" y="20" width="460" height="290" rx="10" />
  <text class="h" x="44" y="50">Typosquatting</text>
  <text class="s" x="44" y="70">Publish a name one edit away and wait for a typo.</text>

  <rect class="real" x="50" y="110" width="150" height="64" rx="8" />
  <text class="t" x="125" y="138" text-anchor="middle">axios</text>
  <text class="s" x="125" y="156" text-anchor="middle">real, popular</text>

  <path class="edge" d="M200,142 L258,142" />
  <text class="s" x="229" y="132" text-anchor="middle">typo</text>

  <rect class="fake" x="270" y="110" width="160" height="64" rx="8" />
  <text class="t" x="350" y="138" text-anchor="middle">axois</text>
  <text class="s" x="350" y="156" text-anchor="middle">look-alike, attacker</text>

  <text class="s" x="50" y="210">Distance 1 (adjacent transposition) — ConfusionGuard scores +50.</text>
  <text class="s" x="50" y="232">Separator tricks such as req-ue-sts are normalised first.</text>

  <!-- Dependency confusion -->
  <rect class="panel" x="520" y="20" width="460" height="290" rx="10" />
  <text class="h" x="544" y="50">Dependency confusion</text>
  <text class="s" x="544" y="70">Same name in a public registry can shadow a private one.</text>

  <rect class="priv" x="550" y="110" width="185" height="64" rx="8" />
  <text class="t" x="642" y="138" text-anchor="middle">@company/internal</text>
  <text class="s" x="642" y="156" text-anchor="middle">private dependency</text>

  <path class="edge" d="M735,142 L780,142" />
  <text class="s" x="757" y="132" text-anchor="middle">resolve</text>

  <rect class="fake" x="792" y="110" width="160" height="64" rx="8" />
  <text class="t" x="872" y="138" text-anchor="middle">internal</text>
  <text class="s" x="872" y="156" text-anchor="middle">public, attacker</text>

  <text class="s" x="550" y="210">A name missing from the public registry still scores +70:</text>
  <text class="s" x="550" y="232">review it before a resolver decides for you.</text>

  <text class="s" x="20" y="318">ConfusionGuard checks the names, not just the versions — before anything is installed.</text>
</svg>
